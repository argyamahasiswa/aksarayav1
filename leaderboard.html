<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AksaRaya - Papan Peringkat</title>
    <link rel="stylesheet" href="petualangan.css" />
    <style>
      /* Tambahan CSS Khusus Tabel Peringkat */
      .leaderboard-card {
        max-width: 800px;
        margin: 40px auto;
        text-align: center;
      }
      .table-container {
        margin-top: 20px;
        overflow-x: auto;
        border-radius: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        background: rgba(245, 158, 11, 0.2);
        padding: 12px;
        color: var(--gold-light);
        font-weight: 900;
      }
      td {
        padding: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        font-weight: 700;
      }
      tr:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      /* Warna khusus top 3 */
      .rank-1 td {
        color: #fbbf24;
        background: rgba(245, 158, 11, 0.1);
        font-weight: 900;
      }
      .rank-2 td {
        color: #e2e8f0;
        background: rgba(226, 232, 240, 0.1);
      }
      .rank-3 td {
        color: #d97706;
        background: rgba(217, 119, 6, 0.1);
      }

      .loading-text {
        font-size: 16px;
        color: var(--gold-light);
        margin: 30px 0;
        font-weight: 800;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% {
          opacity: 0.5;
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <main class="adventure-viewport">
      <nav class="hud-navbar">
        <button
          class="btn-hud-back"
          type="button"
          onclick="window.location.href = 'dashboard.html'"
        >
          <span class="icon">🏠</span><span>Dashboard</span>
        </button>

        <div class="hud-right">
          <div class="brand-box">
            <span class="brand-title">AksaRaya Ranking</span>
          </div>

          <button
            class="btn-hud-back"
            id="soundButton"
            type="button"
            aria-label="Aktifkan atau matikan suara"
            title="Suara"
          >
            <span id="soundIcon">🔊</span>
          </button>
        </div>
      </nav>

      <section class="leaderboard-card card-glass">
        <div class="hero-badge">
          <span>🏆</span><span>KLASEMEN KELAS</span><span>🏆</span>
        </div>
        <h1 class="hero-title" style="margin-bottom: 10px">
          Papan <span>Peringkat</span>
        </h1>
        <p style="color: var(--text-muted); font-size: 14px">
          Daftar petualang paling cepet lan pinter ing kelas iki!
        </p>

        <div id="loading" class="loading-text">
          Menarik gulungan data seka server... 📜⏳
        </div>

        <div class="table-container" id="tableContainer" hidden>
          <table>
            <thead>
              <tr>
                <th>Peringkat</th>
                <th>Nama Petualang</th>
                <th>Absen</th>
                <th>Skor Total</th>
                <th>Waktu</th>
              </tr>
            </thead>
            <tbody id="leaderboardBody">
              <!-- Data dimasukkan via JS -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="aksaraya-sound.js"></script>
    <script src="click-sound.js"></script>
    <script src="leaderboard.js"></script>
  </body>
</html>
